name: Flutter Build and Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.38.9'
  JAVA_VERSION: '17'

jobs:
  analyze:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-{{ arch }}-{{ hashFiles('**/pubspec.lock') }}

      - name: Write Flutter SDK path to local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties
          echo "flutter.versionCode=1" >> android/local.properties
          echo "flutter.versionName=1.0.0" >> android/local.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  build:
    name: Build APK (Android ARM64)
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-{{ arch }}-{{ hashFiles('**/pubspec.lock') }}

      - name: Write Flutter SDK path to local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties
          echo "flutter.versionCode=1" >> android/local.properties
          echo "flutter.versionName=1.0.0" >> android/local.properties

      # 还原签名密钥 —— 只需要配置 **1 个** Secret。
      #
      # 在仓库 Settings → Secrets and variables → Actions 新建：
      #    名称：ANDROID_SIGNING
      #    值  ：本地执行下面这条命令的输出（一长串 base64）
      #
      #   cd android && tar czf - app/keystore.jks key.properties | base64 -w0
      #
      # 这里把一个 tar.gz（含 keystore 与 key.properties）整体 base64，
      # 所以密码、别名都打包在里面，不必再单独配 4 个 Secret。
      #
      # 为什么不能直接把 keystore 提交进仓库：本仓库是**公开**的，
      # 提交即等于把签名私钥公开发布 —— 任何人都能用同一签名打出被
      # Android 视为合法更新的 APK，进而冒充本应用向用户推送恶意版本。
      #
      # release 构建强制要求自定义签名，因此缺这个 Secret 会直接失败，
      # 不会退化成 debug 签名。
      - name: Setup signing keystore
        env:
          ANDROID_SIGNING: ${{ secrets.ANDROID_SIGNING }}
        run: |
          if [ -z "$ANDROID_SIGNING" ]; then
            echo "::error::未配置 ANDROID_SIGNING，release 构建必须使用自定义签名。"
            echo "请在仓库 Settings → Secrets and variables → Actions 新建 Secret："
            echo "  名称 ANDROID_SIGNING"
            echo "  值   本地执行： cd android && tar czf - app/keystore.jks key.properties | base64 -w0"
            exit 1
          fi
          echo "$ANDROID_SIGNING" | base64 -d | tar xzf - -C android
          echo "签名密钥已就绪："
          ls -la android/app/keystore.jks android/key.properties
          keytool -list -keystore android/app/keystore.jks \
            -storepass "$(grep '^storePassword=' android/key.properties | cut -d= -f2)" | tail -3

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test || true

      - name: Clean and build (release)
        run: |
          flutter clean && flutter pub get
          flutter build apk \
            --release \
            --target-platform=android-arm64 \
            --dart-define=FLUTTER_BUILD_MODE=release

      - name: Build App Bundle (release, no obfuscate)
        run: |
          flutter build appbundle \
            --release \
            --target-platform=android-arm64 \
            --dart-define=FLUTTER_BUILD_MODE=release || true

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: self-discipline-checkin-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
          if-no-files-found: ignore

      - name: Create Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}-${{ github.sha }}
          name: Release ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
