name: metamorphosis_checkin
description: 自律 - 每日习惯养成打卡 - 青少年个人形象管理应用
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

  # 液态玻璃UI库 - 使用本地路径（vendor/）
  liquid_glass_widgets:
    path: vendor/liquid_glass_widgets

  # 状态管理
  provider: ^6.1.1

  # 数据库
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1

  # 通知
  flutter_local_notifications: ^16.2.0
  permission_handler: ^11.1.0
  timezone: ^0.9.2

  # 图表
  fl_chart: ^0.65.0

  # Rx
  rxdart: ^0.27.7

  # 导出
  csv: ^6.0.0
  pdf: ^3.10.6
  file_picker: ^8.0.0

  # 图片处理
  image: ^4.1.3

  # 分享
  share_plus: ^7.2.1

  # 网络请求（调试上传）
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/wallpapers/
    - assets/icons/
