name: metamorphosis_checkin
description: 自律 - 每日习惯养成打卡 - 青少年个人形象管理应用
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

  # 液态玻璃UI库 - 使用本地路径（vendor/）
  liquid_glass_widgets:
    path: vendor/liquid_glass_widgets

  # 状态管理
  provider: ^6.1.5+1

  # 数据库
  sqflite: ^2.4.3
  path: ^1.9.1
  path_provider: ^2.1.6

  # 通知
  flutter_local_notifications: ^22.3.0
  permission_handler: ^13.0.1
  timezone: ^0.11.1

  # 图表
  fl_chart: ^1.2.0

  # Rx
  rxdart: ^0.28.0

  # 导出
  csv: ^8.0.0
  pdf: ^3.13.0
  file_picker: ^12.1.3

  # 图片处理
  image: ^4.9.2

  # 分享
  share_plus: ^13.3.0

  # 网络请求（调试上传）
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/wallpapers/
    - assets/icons/
